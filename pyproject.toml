[project]
name = "ppflx-bench"
version = "1.0.0"
description = "Benchmark harness for ppflx: privacy-preserving federated learning with HE, ZKP and DP on Flower"
requires-python = ">=3.12,<3.13"
dependencies = ["flwr[simulation]==1.36.0"]

[tool.flwr.app]
publisher = "txcorpi0x"
# The ServerApp and ClientApp are imported from the `ppflx_bench` package on
# PYTHONPATH (ppflx_bench.launch puts this checkout there), not from a copy inside the
# FAB: the packages find their keys and datasets relative to their own location.
fab-include = ["/README.md"]

[tool.flwr.app.components]
serverapp = "ppflx_bench.app:server_app"
clientapp = "ppflx_bench.app:client_app"

# Run config read by ppflx.config.FLConfig.from_run_config. Numeric 0 means
# "unset" for min-eval-clients (num-clients // 2), dirichlet-alpha (IID),
# dp-epsilon (use the DP parameter file) and round-timeout (no limit).
[tool.flwr.app.config]
mode = "baseline"
dataset = "healthcare"
data-path = "./dataset/"
num-clients = 3
num-rounds = 3
local-epochs = 1
batch-size = 16
learning-rate = 0.001
seed = 42
device = "cpu"
num-workers = 0
frac-fit = 1.0
frac-eval = 0.5
min-fit-clients = 2
min-eval-clients = 0
min-avail-clients = 2
dirichlet-alpha = 0.0
he-tenseal-secret-path = "keys/he_tenseal/secret_context.bin"
he-tenseal-public-path = "keys/he_tenseal/public_context.bin"
zkp-backend = "gnark"
zkp-params-path = "keys/zkp/zkp_params.json"
dp-params-path = "keys/dp/dp_params.json"
dp-epsilon = 0.0
results-dir = "./results/"
model-save = ""
benchmark = true
sim-mode = false
chain-backend = "mock"
chain-ledger-path = ""
round-timeout = 0
